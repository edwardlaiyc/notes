<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
  <!-- system boundary -->
  <rect x="150" y="18" width="460" height="400" fill="#ffffff" stroke="#222" stroke-width="1.3" rx="2"/>
  <text x="380" y="36" text-anchor="middle" font-weight="bold">&lt;System name&gt;</text>

  <!-- actor helper: head r9 at y-30, body y-21..y+3, arms y-12, legs to y+24 -->
  <g stroke="#222" stroke-width="1.4" fill="#ffffff">
    <!-- Primary user (60,95) -->
    <circle cx="60" cy="65" r="9"/><path d="M60,74 V98 M46,83 H74 M60,98 L48,120 M60,98 L72,120" fill="none"/>
    <!-- Secondary user (60,215) -->
    <circle cx="60" cy="190" r="9"/><path d="M60,199 V223 M46,208 H74 M60,223 L48,245 M60,223 L72,245" fill="none"/>
    <!-- Admin (60,350) -->
    <circle cx="60" cy="330" r="9"/><path d="M60,339 V363 M46,348 H74 M60,363 L48,385 M60,363 L72,385" fill="none"/>
    <!-- Device (715,160) -->
    <circle cx="715" cy="135" r="9"/><path d="M715,144 V168 M701,153 H729 M715,168 L703,190 M715,168 L727,190" fill="none"/>
    <!-- External system (715,300) -->
    <circle cx="715" cy="275" r="9"/><path d="M715,284 V308 M701,293 H729 M715,308 L703,330 M715,308 L727,330" fill="none"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="60" y="136">Primary user</text><text x="60" y="150" fill="#555">(e.g. Homeowner)</text>
    <text x="60" y="261">Secondary user</text><text x="60" y="275" fill="#555">(e.g. Guest)</text>
    <text x="60" y="401">Admin</text>
    <text x="715" y="206">&lt;Device&gt;</text><text x="715" y="220" fill="#555">«device»</text>
    <text x="715" y="346">&lt;External system&gt;</text><text x="715" y="360" fill="#555">«system»</text>
  </g>

  <!-- associations (plain lines) -->
  <g stroke="#222" stroke-width="1.2" fill="none">
    <line x1="80" y1="88" x2="196" y2="72"/>
    <line x1="80" y1="96" x2="192" y2="178"/>
    <line x1="80" y1="212" x2="190" y2="192"/>
    <line x1="80" y1="352" x2="188" y2="358"/>
    <line x1="343" y1="182" x2="695" y2="158"/>
    <line x1="343" y1="282" x2="695" y2="296"/>
  </g>

  <!-- use cases -->
  <g stroke="#222" stroke-width="1.2" fill="#ffffff">
    <ellipse cx="268" cy="70" rx="76" ry="24"/>
    <ellipse cx="268" cy="185" rx="78" ry="27"/>
    <ellipse cx="268" cy="282" rx="78" ry="27"/>
    <ellipse cx="268" cy="365" rx="80" ry="27"/>
    <ellipse cx="505" cy="85" rx="60" ry="22"/>
    <ellipse cx="505" cy="215" rx="88" ry="27"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="268" y="74">&lt;Main goal 2&gt;</text>
    <text x="268" y="181">&lt;Main goal 1&gt;</text><text x="268" y="196" fill="#555">(verb + noun)</text>
    <text x="268" y="278">&lt;Conditional step&gt;</text><text x="268" y="293" fill="#555">(e.g. Clarify Command)</text>
    <text x="268" y="361">&lt;Admin goal&gt;</text><text x="268" y="376" fill="#555">(e.g. Manage Accounts)</text>
    <text x="505" y="89">Log In</text>
    <text x="505" y="211">&lt;Always-done step&gt;</text><text x="505" y="226" fill="#555">(e.g. Check Access Window)</text>
  </g>

  <!-- include / extend (dashed, open arrowhead) -->
  <g stroke="#333" stroke-width="1.2" fill="none" stroke-dasharray="6 4" marker-end="url(#oa)">
    <line x1="344" y1="72" x2="443" y2="82"/>
    <line x1="330" y1="168" x2="456" y2="100"/>
    <line x1="346" y1="192" x2="415" y2="205"/>
    <line x1="318" y1="345" x2="482" y2="106"/>
    <line x1="268" y1="255" x2="268" y2="214"/>
  </g>
  <g fill="#333" font-size="11">
    <text x="372" y="66">«include»</text>
    <text x="356" y="124">«include»</text>
    <text x="352" y="214">«include»</text>
    <text x="360" y="306">«include»</text>
    <text x="276" y="236">«extend»</text>
    <text x="276" y="249" fill="#555">[if unclear]</text>
  </g>
</svg>
