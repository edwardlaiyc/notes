<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">A 1-indexed max-heap and its array layout</title>
  <desc id="desc">The max-heap values 90, 70, 80, 20, 60, 50, and 40 are shown in a complete binary tree and as a 1-indexed array.</desc>
  <style>
    .edge{stroke:#355070;stroke-width:3}.node{fill:#e8f1ff;stroke:#355070;stroke-width:3}.label{font:700 21px Arial,sans-serif;fill:#17243a}.small{font:600 17px Arial,sans-serif;fill:#17243a}.array{fill:#fff7df;stroke:#b7791f;stroke-width:2}.idx{font:600 15px Arial,sans-serif;fill:#7a4d12}
  </style>
  <line class="edge" x1="175" y1="57" x2="105" y2="125"/><line class="edge" x1="175" y1="57" x2="245" y2="125"/>
  <line class="edge" x1="105" y1="143" x2="60" y2="207"/><line class="edge" x1="105" y1="143" x2="140" y2="207"/>
  <line class="edge" x1="245" y1="143" x2="210" y2="207"/><line class="edge" x1="245" y1="143" x2="290" y2="207"/>
  <g text-anchor="middle"><circle class="node" cx="175" cy="45" r="25"/><text class="label" x="175" y="52">90</text><circle class="node" cx="105" cy="135" r="25"/><text class="label" x="105" y="142">70</text><circle class="node" cx="245" cy="135" r="25"/><text class="label" x="245" y="142">80</text><circle class="node" cx="60" cy="220" r="25"/><text class="label" x="60" y="227">20</text><circle class="node" cx="140" cy="220" r="25"/><text class="label" x="140" y="227">60</text><circle class="node" cx="210" cy="220" r="25"/><text class="label" x="210" y="227">50</text><circle class="node" cx="290" cy="220" r="25"/><text class="label" x="290" y="227">40</text></g>
  <text class="small" x="390" y="36">1-indexed array</text>
  <g text-anchor="middle"><rect class="array" x="390" y="54" width="42" height="42"/><rect class="array" x="432" y="54" width="42" height="42"/><rect class="array" x="474" y="54" width="42" height="42"/><rect class="array" x="516" y="54" width="42" height="42"/><rect class="array" x="558" y="54" width="42" height="42"/><rect class="array" x="600" y="54" width="42" height="42"/><rect class="array" x="642" y="54" width="42" height="42"/><text class="idx" x="411" y="49">1</text><text class="idx" x="453" y="49">2</text><text class="idx" x="495" y="49">3</text><text class="idx" x="537" y="49">4</text><text class="idx" x="579" y="49">5</text><text class="idx" x="621" y="49">6</text><text class="idx" x="663" y="49">7</text><text class="label" x="411" y="81">90</text><text class="label" x="453" y="81">70</text><text class="label" x="495" y="81">80</text><text class="label" x="537" y="81">20</text><text class="label" x="579" y="81">60</text><text class="label" x="621" y="81">50</text><text class="label" x="663" y="81">40</text></g>
  <text class="small" x="390" y="138">for index i: parent = floor(i/2)</text><text class="small" x="390" y="170">left = 2i, right = 2i + 1</text><text class="small" x="390" y="213">every parent key is at least its child key</text>
</svg>
